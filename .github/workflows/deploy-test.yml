name: Deploy test

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Lint and typecheck the frontend and backend before any build/deploy.
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci

      - name: Frontend lint
        working-directory: .
        run: npm run lint

      - name: Frontend typecheck
        working-directory: .
        run: npm run typecheck

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

  # Build images in CI and push them to GHCR (never built on the host).
  build-and-push:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/evgpokr/yaizy-python-ide/backend:${{ github.ref_name }}
            ghcr.io/evgpokr/yaizy-python-ide/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/evgpokr/yaizy-python-ide/frontend:${{ github.ref_name }}
            ghcr.io/evgpokr/yaizy-python-ide/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sandbox
        uses: docker/build-push-action@v6
        with:
          context: docker/python-sandbox
          push: true
          tags: |
            ghcr.io/evgpokr/yaizy-python-ide/sandbox:${{ github.ref_name }}
            ghcr.io/evgpokr/yaizy-python-ide/sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pull the freshly built images on the test host and bring the stack up.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Secrets/vars resolve from the "test" Environment (not from names).
    environment: test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          ignore_known_hosts: true
          script_stop: true
          envs: GHCR_USER,GHCR_PULL_TOKEN,JWT_SECRET,YAIZY_OAUTH_AUTHORIZE_URL,YAIZY_OAUTH_TOKEN_URL,YAIZY_OAUTH_REDIRECT_URI,YAIZY_OAUTH_CLIENT_ID,YAIZY_OAUTH_CLIENT_SECRET,YAIZY_OAUTH_JWT_SECRET,YAIZY_OAUTH_ISSUER
          script: |
            set -euo pipefail

            APP_DIR=/opt/python-ide
            REPO=https://github.com/${{ github.repository }}.git

            # 1. Ensure the repo is present and up to date.
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all && git reset --hard origin/test

            # 2. Write backend/.env from vars/secrets (only keys that are provided).
            ENV_FILE="$APP_DIR/backend/.env"
            touch "$ENV_FILE"
            > "$ENV_FILE"
            [ -n "${YAIZY_OAUTH_AUTHORIZE_URL:-}" ] && echo "YAIZY_OAUTH_AUTHORIZE_URL=$YAIZY_OAUTH_AUTHORIZE_URL" >> "$ENV_FILE"
            [ -n "${YAIZY_OAUTH_TOKEN_URL:-}" ] && echo "YAIZY_OAUTH_TOKEN_URL=$YAIZY_OAUTH_TOKEN_URL" >> "$ENV_FILE"
            [ -n "${YAIZY_OAUTH_REDIRECT_URI:-}" ] && echo "YAIZY_OAUTH_REDIRECT_URI=$YAIZY_OAUTH_REDIRECT_URI" >> "$ENV_FILE"
            [ -n "${YAIZY_OAUTH_ISSUER:-}" ] && echo "YAIZY_OAUTH_ISSUER=$YAIZY_OAUTH_ISSUER" >> "$ENV_FILE"
            [ -n "${JWT_SECRET:-}" ] && echo "JWT_SECRET=$JWT_SECRET" >> "$ENV_FILE"
            [ -n "${YAIZY_OAUTH_CLIENT_ID:-}" ] && echo "YAIZY_OAUTH_CLIENT_ID=$YAIZY_OAUTH_CLIENT_ID" >> "$ENV_FILE"
            [ -n "${YAIZY_OAUTH_CLIENT_SECRET:-}" ] && echo "YAIZY_OAUTH_CLIENT_SECRET=$YAIZY_OAUTH_CLIENT_SECRET" >> "$ENV_FILE"
            [ -n "${YAIZY_OAUTH_JWT_SECRET:-}" ] && echo "YAIZY_OAUTH_JWT_SECRET=$YAIZY_OAUTH_JWT_SECRET" >> "$ENV_FILE"
            echo "--- backend/.env written ---"

            # 3. Write the gitignored docker/.env (non-secret: domain + image tag).
            cat > "$APP_DIR/docker/.env" <<ENVEOF
            DOMAIN=ide.test.yaizy.io
            IMAGE_TAG=test
            ENVEOF

            # 4. Log in to GHCR and pull the images.
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # 5. Bring the stack up (pull-only, no build on the host).
            docker compose -f docker/docker-compose.deploy.yml pull
            docker compose -f docker/docker-compose.deploy.yml up -d

            # 6. Health check.
            sleep 5
            curl -fsS https://ide.test.yaizy.io/health || (echo "healthcheck failed"; docker compose -f docker/docker-compose.deploy.yml logs --tail 50; exit 1)
        env:
          GHCR_USER: ${{ vars.GHCR_USER || 'yaizy-io' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          YAIZY_OAUTH_AUTHORIZE_URL: ${{ vars.YAIZY_OAUTH_AUTHORIZE_URL }}
          YAIZY_OAUTH_TOKEN_URL: ${{ vars.YAIZY_OAUTH_TOKEN_URL }}
          YAIZY_OAUTH_REDIRECT_URI: ${{ vars.YAIZY_OAUTH_REDIRECT_URI }}
          YAIZY_OAUTH_CLIENT_ID: ${{ vars.YAIZY_OAUTH_CLIENT_ID }}
          YAIZY_OAUTH_CLIENT_SECRET: ${{ secrets.YAIZY_OAUTH_CLIENT_SECRET }}
          YAIZY_OAUTH_JWT_SECRET: ${{ secrets.YAIZY_OAUTH_JWT_SECRET }}
          YAIZY_OAUTH_ISSUER: ${{ vars.YAIZY_OAUTH_ISSUER }}
